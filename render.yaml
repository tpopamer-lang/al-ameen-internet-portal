services:
  - type: web
    name: al-ameen-internet-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://tpopamer-lang.github.io
